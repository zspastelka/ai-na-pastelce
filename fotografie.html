<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fotografie a momentky ze setkání, workshopů a aktivit projektu AI na Pastelce.">
  <meta name="theme-color" content="#172554">
  <title>Fotografie | AI na Pastelce</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-main { padding: 42px 0 70px; }
    .gallery-section { margin: 0 0 42px; }
    .gallery-section:last-child { margin-bottom: 0; }
    .gallery-heading { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; }
    .gallery-heading h1, .gallery-heading h2 { margin: 0; color: var(--navy); font-size: 1.55rem; line-height: 1.25; letter-spacing: -.03em; }
    .gallery-icon { flex: 0 0 52px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; font-size: 1.55rem; }
    .gallery-empty { min-height: 150px; display: grid; place-items: center; padding: 24px; border: 1px dashed #cbd5e1; border-radius: var(--radius-lg); background: #fff; color: var(--muted); text-align: center; }
    .gallery-empty p { margin: 0; }
    .gallery-empty strong { display: block; margin-bottom: 4px; color: var(--navy); font-weight: 700; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .student-carousel { position: relative; }
    .student-carousel-viewport { overflow: hidden; }
    .student-carousel-track { display: flex; gap: 16px; transition: transform .35s ease; }
    .student-carousel-track figure { flex: 0 0 calc((100% - 32px) / 3); min-width: 0; margin: 0; overflow: hidden; border-radius: var(--radius-md); background: #e2e8f0; }
    .student-carousel-track img { display: block; width: 100%; height: 240px; object-fit: cover; cursor: zoom-in; }
    .student-carousel-controls { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .student-carousel-controls button { width: 38px; height: 38px; border: 0; border-radius: 50%; background: #172554; color: #fff; font-size: 22px; cursor: pointer; }
    .student-carousel-controls button:disabled { opacity: .35; cursor: default; }
    .student-carousel-controls[hidden] { display: none; }
    .gallery-grid figure { margin: 0; overflow: hidden; border-radius: var(--radius-md); background: #e2e8f0; }
    .gallery-grid img { display: block; width: 100%; height: 240px; object-fit: cover; }
    .gallery-grid img { cursor: zoom-in; transition: transform .2s ease; }
    .gallery-grid figure:hover img { transform: scale(1.025); }
    .photo-lightbox { width: min(92vw, 1100px); max-width: none; max-height: 90vh; padding: 48px 16px 16px; border: 0; border-radius: 16px; background: #0f172a; color: #fff; overflow: visible; }
    .photo-lightbox::backdrop { background: rgba(15, 23, 42, .88); }
    .photo-lightbox img { display: block; max-width: 100%; max-height: calc(90vh - 64px); width: auto; height: auto; margin: 0 auto; object-fit: contain; }
    .photo-lightbox-close { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #fff; color: #172554; font-size: 24px; line-height: 1; cursor: pointer; }
    .photo-lightbox-close:focus-visible { outline: 3px solid #facc15; outline-offset: 3px; }
    @media (max-width: 760px) { .gallery-main { padding: 34px 0 54px; } .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .gallery-grid img { height: 190px; } .student-carousel-track img { height: 190px; } }
    @media (max-width: 480px) { .gallery-grid { grid-template-columns: 1fr; } .gallery-grid img { height: auto; max-height: 300px; } .student-carousel-track { gap: 8px; } .student-carousel-track figure { flex-basis: calc((100% - 16px) / 3); } .student-carousel-track img { height: 120px; } .gallery-heading { align-items: flex-start; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-container site-nav activity-nav">
      <a class="site-brand" href="index.html" aria-label="AI na Pastelce – úvodní stránka">
        <span class="site-brand-mark">✦</span><span>AI na Pastelce</span>
      </a>
      <a class="activity-back" href="index.html#ze-zivota">← Zpět na úvodní stránku</a>
    </div>
  </header>

  <main class="gallery-main">
    <div class="site-container">
      <section class="gallery-section" aria-labelledby="gallery-students">
        <div class="gallery-heading">
          <span class="gallery-icon mint" aria-hidden="true">🎒</span>
          <h1 id="gallery-students">Žáci a svět AI</h1>
        </div>
        <!-- Fotografie žáků přidávej do složky images/galerie/zaci/ a jejich cesty vlož jako src obrázků. -->
        <div class="student-carousel" id="student-carousel">
          <div class="student-carousel-viewport">
            <div class="student-carousel-track" id="student-carousel-track">
              <!-- Fotografie žáků vkládej jako jednotlivé figure sem; současně budou vidět vždy tři. -->
            </div>
          </div>
          <div class="gallery-empty" id="student-gallery-empty">
            <p><strong>Fotografie budou doplněny.</strong>Sem přijdou momentky z aktivit a workshopů se žáky.</p>
          </div>
          <div class="student-carousel-controls" id="student-carousel-controls" hidden>
            <button type="button" id="student-carousel-prev" aria-label="Předchozí fotografie">‹</button>
            <button type="button" id="student-carousel-next" aria-label="Další fotografie">›</button>
          </div>
        </div>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-adults">
        <div class="gallery-heading">
          <span class="gallery-icon gold" aria-hidden="true">🤝</span>
          <h2 id="gallery-adults">Rodiče a učitelé a svět AI</h2>
        </div>
        <!-- Fotografie rodičů a učitelů přidávej do složky images/galerie/dospeli/ a jejich cesty vlož jako src obrázků. -->
        <div class="gallery-grid">
          <figure><img src="images/galerie/dospeli/U%C4%8Ditel%C3%A9.png" alt="Učitelé při společném objevování umělé inteligence" loading="lazy"></figure>
          <figure><img src="images/galerie/dospeli/20260513_152711747_iOS.jpg" alt="Setkání rodičů při workshopu o umělé inteligenci" loading="lazy"></figure>
          <figure><img src="images/galerie/dospeli/Rodi%C4%8Dovsk%C3%A1%20kav%C3%A1rna%20(2).png" alt="Rodičovská kavárna věnovaná umělé inteligenci" loading="lazy"></figure>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-container site-footer-inner">
      <div><strong>AI na Pastelce</strong><br><span class="site-muted">Vzdělávací projekt ZŠ a MŠ Mladá Boleslav, 17. listopadu 1325</span></div>
      <a class="activity-footer-link" href="index.html">Zpět na úvodní stránku ↑</a>
    </div>
  </footer>

  <dialog class="photo-lightbox" id="photo-lightbox" aria-label="Zvětšená fotografie">
    <button class="photo-lightbox-close" type="button" aria-label="Zavřít fotografii">×</button>
    <img id="photo-lightbox-image" src="" alt="">
  </dialog>
  <script>
    const photoLightbox = document.getElementById('photo-lightbox');
    const photoLightboxImage = document.getElementById('photo-lightbox-image');
    const photoLightboxClose = photoLightbox.querySelector('.photo-lightbox-close');
    const studentTrack = document.getElementById('student-carousel-track');
    const studentControls = document.getElementById('student-carousel-controls');
    const studentEmpty = document.getElementById('student-gallery-empty');
    const studentPrev = document.getElementById('student-carousel-prev');
    const studentNext = document.getElementById('student-carousel-next');
    let studentIndex = 0;

    function updateStudentCarousel() {
      const photos = studentTrack.querySelectorAll('figure');
      const maxIndex = Math.max(0, photos.length - 3);
      studentIndex = Math.min(studentIndex, maxIndex);
      const step = photos.length ? photos[0].getBoundingClientRect().width + parseFloat(getComputedStyle(studentTrack).gap || 0) : 0;
      studentTrack.style.transform = `translateX(-${studentIndex * step}px)`;
      studentPrev.disabled = studentIndex === 0;
      studentNext.disabled = studentIndex >= maxIndex;
      studentControls.hidden = photos.length <= 3;
      studentEmpty.hidden = photos.length > 0;
    }

    studentPrev.addEventListener('click', () => { studentIndex = Math.max(0, studentIndex - 1); updateStudentCarousel(); });
    studentNext.addEventListener('click', () => { studentIndex = Math.min(studentTrack.querySelectorAll('figure').length - 3, studentIndex + 1); updateStudentCarousel(); });
    updateStudentCarousel();
    window.addEventListener('resize', updateStudentCarousel);

    document.querySelectorAll('.gallery-grid img, .student-carousel-track img').forEach((photo) => {
      photo.addEventListener('click', () => {
        photoLightboxImage.src = photo.src;
        photoLightboxImage.alt = photo.alt;
        photoLightbox.showModal();
      });
    });

    photoLightboxClose.addEventListener('click', () => photoLightbox.close());
    photoLightbox.addEventListener('click', (event) => {
      if (event.target === photoLightbox) photoLightbox.close();
    });
  </script>
</body>
</html>
